name: Camera fix APK check

on:
  push:
    branches: [fix/front-camera-exposure]

permissions:
  contents: read

jobs:
  camera-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test and build signed APK
        run: gradle --no-daemon testDebugUnitTest assembleRelease -PciVersionCode=63
      - uses: actions/upload-artifact@v4
        with:
          name: front-camera-exposure-apk
          path: app/build/outputs/apk/release/app-release.apk
