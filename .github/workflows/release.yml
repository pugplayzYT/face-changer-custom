name: Build and Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test and build signed release APK
        run: gradle --no-daemon clean testDebugUnitTest assembleRelease -PciVersionCode=${{ github.run_number }}
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk face-changer-custom-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: face-changer-custom-release
          path: face-changer-custom-release.apk
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: Automated signed **release** APK for `${{ github.sha }}`. The reproducible open-source signing identity lives in the repository under `signing/`.
          prerelease: false
          make_latest: true
          files: face-changer-custom-release.apk
