import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def ciVersionCode = providers.gradleProperty('ciVersionCode').getOrElse('1').toInteger()

// Public/open-source release signing identity. Anyone cloning the repo can reproduce the same
// signed release APK, which is intentional for this project.
def signingPropertiesFile = rootProject.file('signing/signing.properties')
def releaseKeystoreFile = rootProject.file('signing/release-key.jks')
if (!signingPropertiesFile.exists() || !releaseKeystoreFile.exists()) {
    throw new GradleException('Missing public release signing files under signing/')
}

def signingProperties = new Properties()
signingPropertiesFile.withInputStream { signingProperties.load(it) }

android {
    namespace 'com.pugplayz.facechanger'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pugplayz.facechanger'
        minSdk 26
        targetSdk 35
        versionCode ciVersionCode
        versionName "1.0.${ciVersionCode}"
    }

    signingConfigs {
        release {
            storeFile releaseKeystoreFile
            storePassword signingProperties.getProperty('storePassword')
            keyAlias signingProperties.getProperty('keyAlias')
            keyPassword signingProperties.getProperty('keyPassword')
        }
    }

    buildFeatures { compose true }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    // MediaPipe task files are memory-mapped/read from assets by the native task runtime on some
    // devices. Package them uncompressed so model loading is reliable across Android versions/OEMs.
    androidResources {
        noCompress += ['task']
    }

    packaging {
        resources.excludes += '/META-INF/{AL2.0,LGPL2.1}'
    }
}

ext {
    cameraXVersion = '1.4.1'
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation "androidx.camera:camera-core:$cameraXVersion"
    implementation "androidx.camera:camera-camera2:$cameraXVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraXVersion"
    implementation "androidx.camera:camera-view:$cameraXVersion"
    implementation 'com.google.mediapipe:tasks-vision:0.10.20'
}

// Keep the repository small while making every clone buildable: models are fetched at build time.
def modelDir = file("$projectDir/src/main/assets")
def models = [
    'face_landmarker.task': 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task',
    'hand_landmarker.task': 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task',
    'pose_landmarker_full.task': 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task'
]

tasks.register('downloadModels') {
    outputs.files(models.keySet().collect { new File(modelDir, it) })
    doLast {
        modelDir.mkdirs()
        models.each { name, address ->
            def output = new File(modelDir, name)
            if (!output.exists() || output.length() < 1024) {
                logger.lifecycle("Downloading MediaPipe model: $name")
                new URL(address).withInputStream { input -> output.withOutputStream { it << input } }
            }
        }
    }
}

tasks.named('preBuild').configure { dependsOn 'downloadModels' }
